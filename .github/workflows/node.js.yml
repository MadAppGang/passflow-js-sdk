# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Lint,Test,Build App

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Every LTS line `engines` admits: 22 (maintenance), 24 (maintenance), 26 (active).
        # See https://nodejs.org/en/about/previous-releases
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        # No `version:`: the action reads `packageManager` from package.json, so CI
        # and local installs run the same pnpm.
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'


      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint

      # Fails when the vendored corpus differs from the mirror commit named in its
      # SOURCE file. It skips only while SOURCE is `pending` and the mirror repository
      # returns 404. With a commit in SOURCE, that 404 fails.
      - name: Check vendored corpus
        run: pnpm corpus:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

      # Packs the build, installs the tarball into a throwaway consumer with npm, and runs
      # tsc under node16, nodenext, bundler and node16-CJS with skipLibCheck off. This is the
      # check that would have caught the 0.19.0/0.20.0 extensionless-specifier types.
      - name: Check published types resolve (packed tarball)
        run: pnpm check:types-consumer --skip-build
