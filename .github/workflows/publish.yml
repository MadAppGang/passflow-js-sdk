name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is for the release page below, not for the publish:
      # npm auth is OIDC (`id-token`), so no registry secret is involved.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''

      # The release page is the only record of a version that a reader without
      # npm access can find, and it lapsed for every tag from v0.13.2 to v0.16.0
      # because nothing created it. It runs after the publish so a failed
      # publish leaves no page claiming the version shipped, and `--verify-tag`
      # refuses a page for a tag that is not on the remote.
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
