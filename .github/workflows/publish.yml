name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # The tag names the release; `package.json` names what npm publishes.
      # Nothing tied the two together, so a tag pushed against a stale manifest
      # published the manifest's version and went green. `passflow-react-sdk`'s
      # workflow has carried this check for several releases.
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''

  # The release page is the only record of a version that a reader without npm
  # access can find, and it lapsed for every tag from v0.13.2 to v0.16.0 because
  # nothing created it.
  #
  # It is a SECOND JOB rather than a step, so `contents: write` is never held
  # while `pnpm install`, `pnpm test` and `pnpm build` run third-party code in
  # the publish job — that job keeps `contents: read`. `needs: publish` means a
  # failed publish leaves no page claiming the version shipped. There is no
  # checkout: `gh` works against the API, so the write token never reaches a
  # working tree. Note that a release created with `GITHUB_TOKEN` does not fire
  # `release: published`, so nothing may be keyed on that event.
  release-page:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to create."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
